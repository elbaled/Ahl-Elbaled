<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>لوحة الإدارة - أهل البلد</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 21px;
        }

        #logoutBtn {
            border: 0;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            color: #2563eb;
            font-weight: bold;
        }

        main {
            max-width: 950px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .status {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        #adminStatus {
            color: #16a34a;
            font-weight: bold;
        }

        .section-title {
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .request {
            background: white;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 15px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        .request h3 {
            margin-top: 0;
            color: #2563eb;
        }

        .account-number {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            padding: 7px 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .info {
            margin: 9px 0;
            color: #555;
            line-height: 1.6;
        }

        .info strong {
            color: #222;
        }

        /* =====================================
           بيانات مقدم طلب الخدمة
        ===================================== */

        .requester-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-right: 4px solid #2563eb;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .requester-title {
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .requester-info {
            margin: 7px 0;
            color: #555;
            line-height: 1.6;
        }

        .requester-info strong {
            color: #222;
        }

        .uid-box {
            background: #f1f5f9;
            padding: 8px 10px;
            border-radius: 7px;
            font-size: 12px;
            word-break: break-all;
            direction: ltr;
            text-align: left;
            margin-top: 8px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .actions button {
            border: 0;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .approve {
            background: #16a34a;
            color: white;
        }

        .reject {
            background: #dc2626;
            color: white;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 14px;
            color: #777;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 25px;
        }

        .divider {
            height: 2px;
            background: #e5e7eb;
            margin: 35px 0;
        }

        .category {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            padding: 5px 10px;
            border-radius: 7px;
        }

        @media (max-width: 600px) {

            header {
                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }

            .actions button {
                width: 100%;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>
        🏠 لوحة إدارة أهل البلد
    </h1>

    <button id="logoutBtn">
        تسجيل الخروج
    </button>

</header>


<main>

    <div class="status">

        <strong>
            حالة الإدارة:
        </strong>

        <span id="adminStatus">
            جاري التحقق...
        </span>

    </div>


    <h2 class="section-title">
        👤 طلبات إنشاء الحسابات
    </h2>

    <div id="usersContainer">

        <div class="loading">
            جاري تحميل طلبات الحسابات...
        </div>

    </div>


    <div class="divider"></div>


    <h2 class="section-title">
        🛠️ طلبات الخدمات
    </h2>

    <div id="servicesContainer">

        <div class="loading">
            جاري تحميل طلبات الخدمات...
        </div>

    </div>

</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
    getDatabase,
    ref,
    onValue,
    update,
    get
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyBpc-93tAPIRQyYlrpKGc_Yg8QqxuX8PfGI",

    authDomain:
        "ahl-elbaled2.firebaseapp.com",

    databaseURL:
        "https://ahl-elbaled2-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "ahl-elbaled2",

    storageBucket:
        "ahl-elbaled2.firebasestorage.app",

    messagingSenderId:
        "984455426367",

    appId:
        "1:984455426367:web:5420f680f2a4f9b609238a",

    measurementId:
        "G-NQFQWK5T57"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const database =
    getDatabase(app);


const adminStatus =
    document.getElementById(
        "adminStatus"
    );

const usersContainer =
    document.getElementById(
        "usersContainer"
    );

const servicesContainer =
    document.getElementById(
        "servicesContainer"
    );

const logoutBtn =
    document.getElementById(
        "logoutBtn"
    );


let dataListenersStarted =
    false;


/* =====================================
   التحقق من الأدمن
===================================== */

onAuthStateChanged(
    auth,
    (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        const userRef =
            ref(
                database,
                "users/" + user.uid
            );


        onValue(
            userRef,
            (snapshot) => {

                if (!snapshot.exists()) {

                    adminStatus.textContent =
                        "بيانات الحساب غير موجودة ❌";

                    return;

                }


                const userData =
                    snapshot.val();


                if (
                    userData.role !==
                    "admin"
                ) {

                    adminStatus.textContent =
                        "ليس لديك صلاحيات الإدارة ❌";

                    setTimeout(
                        () => {

                            window.location.href =
                                "index.html";

                        },
                        1500
                    );

                    return;

                }


                if (
                    userData.status !==
                    "approved"
                ) {

                    adminStatus.textContent =
                        "حساب الإدارة غير معتمد ❌";

                    return;

                }


                adminStatus.textContent =
                    "تم تسجيل الدخول كمسؤول ✅";


                if (!dataListenersStarted) {

                    dataListenersStarted =
                        true;

                    loadUsers();

                    loadServices();

                }

            }
        );

    }
);


/* =====================================
   طلبات الحسابات
===================================== */

function loadUsers() {

    const usersRef =
        ref(
            database,
            "users"
        );


    onValue(
        usersRef,
        (snapshot) => {

            usersContainer.innerHTML =
                "";


            const data =
                snapshot.val();


            if (!data) {

                showNoUsers();

                return;

            }


            let pendingCount =
                0;


            Object.entries(data)
                .forEach(
                    ([uid, user]) => {

                        if (
                            user.status !==
                            "pending"
                        ) {

                            return;

                        }


                        pendingCount++;


                        const request =
                            document.createElement(
                                "div"
                            );


                        request.className =
                            "request";


                        request.innerHTML = `

                            <h3>
                                👤
                                ${escapeHTML(
                                    user.name ||
                                    "بدون اسم"
                                )}
                            </h3>

                            <div class="account-number">

                                رقم الحساب:
                                ${escapeHTML(
                                    String(
                                        user.accountNumber ||
                                        "غير محدد"
                                    )
                                )}

                            </div>

                            <div class="info">

                                <strong>
                                    البريد الإلكتروني:
                                </strong>

                                ${escapeHTML(
                                    user.email ||
                                    "غير موجود"
                                )}

                            </div>

                            <div class="info">

                                <strong>
                                    تاريخ الطلب:
                                </strong>

                                ${formatDate(
                                    user.createdAt
                                )}

                            </div>

                            <div class="actions">

                                <button
                                    class="approve"
                                    data-user-id="${uid}">

                                    ✅ الموافقة على الحساب

                                </button>

                                <button
                                    class="reject"
                                    data-user-id="${uid}">

                                    ❌ رفض الحساب

                                </button>

                            </div>

                        `;


                        usersContainer.appendChild(
                            request
                        );

                    }
                );


            if (pendingCount === 0) {

                showNoUsers();

                return;

            }


            usersContainer
                .querySelectorAll(
                    ".approve"
                )
                .forEach(
                    (button) => {

                        button.addEventListener(
                            "click",
                            () => {

                                changeUserStatus(
                                    button.dataset.userId,
                                    "approved"
                                );

                            }
                        );

                    }
                );


            usersContainer
                .querySelectorAll(
                    ".reject"
                )
                .forEach(
                    (button) => {

                        button.addEventListener(
                            "click",
                            () => {

                                changeUserStatus(
                                    button.dataset.userId,
                                    "rejected"
                                );

                            }
                        );

                    }
                );

        },

        (error) => {

            console.error(
                "Users error:",
                error
            );


            usersContainer.innerHTML = `

                <div class="empty">

                    ❌ حدث خطأ في تحميل الحسابات

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>

            `;

        }
    );

}


/* =====================================
   تغيير حالة الحساب
===================================== */

async function changeUserStatus(
    uid,
    status
) {

    try {

        await update(
            ref(
                database,
                "users/" + uid
            ),
            {
                status:
                    status
            }
        );


        if (
            status === "approved"
        ) {

            alert(
                "تمت الموافقة على الحساب ✅"
            );

        }

        else {

            alert(
                "تم رفض الحساب ❌"
            );

        }

    }

    catch (error) {

        console.error(
            error
        );

        alert(
            "حدث خطأ أثناء تحديث الحساب:\n" +
            error.message
        );

    }

}


/* =====================================
   طلبات الخدمات
===================================== */

function loadServices() {

    const servicesRef =
        ref(
            database,
            "services"
        );


    onValue(
        servicesRef,
        async (snapshot) => {

            servicesContainer.innerHTML =
                "";


            const data =
                snapshot.val();


            if (!data) {

                showNoServices();

                return;

            }


            /* =====================================
               تحميل بيانات المستخدمين
            ===================================== */

            let usersData =
                {};


            try {

                const usersSnapshot =
                    await get(
                        ref(
                            database,
                            "users"
                        )
                    );


                if (
                    usersSnapshot.exists()
                ) {

                    usersData =
                        usersSnapshot.val() ||
                        {};

                }

            }

            catch (error) {

                console.error(
                    "Error loading users for services:",
                    error
                );

            }


            let pendingCount =
                0;


            Object.entries(data)
                .forEach(
                    ([id, service]) => {

                        if (
                            !service ||
                            service.status !==
                            "pending"
                        ) {

                            return;

                        }


                        pendingCount++;


                        /*
                         * =====================================
                         * معرفة صاحب طلب الخدمة
                         * =====================================
                         */

                        const requester =
                            service.userId &&
                            usersData[service.userId]
                                ? usersData[service.userId]
                                : null;


                        const requesterName =
                            requester?.name ||
                            service.userName ||
                            "غير معروف";


                        const requesterEmail =
                            requester?.email ||
                            service.userEmail ||
                            "غير موجود";


                        const requesterAccountNumber =
                            requester?.accountNumber ||
                            "غير محدد";


                        const requesterUid =
                            service.userId ||
                            "غير موجود";


                        const requestDate =
                            service.createdAt
                                ? formatDate(
                                    service.createdAt
                                )
                                : "غير محدد";


                        const request =
                            document.createElement(
                                "div"
                            );


                        request.className =
                            "request";


                        request.innerHTML = `

                            <h3>

                                🛠️
                                ${escapeHTML(
                                    service.name ||
                                    "خدمة بدون اسم"
                                )}

                            </h3>


                            <!-- =================================
                                 بيانات مقدم طلب الخدمة
                            ================================= -->

                            <div class="requester-box">

                                <div class="requester-title">

                                    👤 مقدم طلب إضافة الخدمة

                                </div>


                                <div class="requester-info">

                                    <strong>
                                        اسم صاحب الطلب:
                                    </strong>

                                    ${escapeHTML(
                                        requesterName
                                    )}

                                </div>


                                <div class="requester-info">

                                    <strong>
                                        📧 البريد الإلكتروني:
                                    </strong>

                                    ${escapeHTML(
                                        requesterEmail
                                    )}

                                </div>


                                <div class="requester-info">

                                    <strong>
                                        🔢 رقم الحساب:
                                    </strong>

                                    ${escapeHTML(
                                        String(
                                            requesterAccountNumber
                                        )
                                    )}

                                </div>


                                <div class="requester-info">

                                    <strong>
                                        📅 تاريخ تقديم الطلب:
                                    </strong>

                                    ${escapeHTML(
                                        requestDate
                                    )}

                                </div>


                                <div class="requester-info">

                                    <strong>
                                        🆔 معرف الحساب:
                                    </strong>

                                    <div class="uid-box">

                                        ${escapeHTML(
                                            requesterUid
                                        )}

                                    </div>

                                </div>

                            </div>


                            <!-- =================================
                                 بيانات الخدمة
                            ================================= -->

                            <div class="info">

                                <strong>
                                    التصنيف:
                                </strong>

                                <span class="category">

                                    ${escapeHTML(
                                        getCategoryName(
                                            service.category
                                        )
                                    )}

                                </span>

                            </div>


                            <div class="info">

                                <strong>
                                    الوصف:
                                </strong>

                                ${escapeHTML(
                                    service.description ||
                                    "لا يوجد"
                                )}

                            </div>


                            <div class="info">

                                <strong>
                                    الهاتف:
                                </strong>

                                ${escapeHTML(
                                    service.phone ||
                                    "غير موجود"
                                )}

                            </div>


                            <div class="info">

                                <strong>
                                    العنوان:
                                </strong>

                                ${escapeHTML(
                                    service.address ||
                                    "غير موجود"
                                )}

                            </div>


                            <div class="info">

                                <strong>
                                    مواعيد العمل:
                                </strong>

                                ${escapeHTML(
                                    service.workingHours ||
                                    "غير محددة"
                                )}

                            </div>


                            <div class="actions">

                                <button
                                    class="approve"
                                    data-service-id="${id}">

                                    ✅ موافقة

                                </button>

                                <button
                                    class="reject"
                                    data-service-id="${id}">

                                    ❌ رفض

                                </button>

                            </div>

                        `;


                        servicesContainer.appendChild(
                            request
                        );

                    }
                );


            if (pendingCount === 0) {

                showNoServices();

                return;

            }


            servicesContainer
                .querySelectorAll(
                    "[data-service-id]"
                )
                .forEach(
                    (button) => {

                        button.addEventListener(
                            "click",
                            () => {

                                const id =
                                    button.dataset.serviceId;


                                const status =
                                    button.classList.contains(
                                        "approve"
                                    )
                                        ? "approved"
                                        : "rejected";


                                changeServiceStatus(
                                    id,
                                    status
                                );

                            }
                        );

                    }
                );

        },

        (error) => {

            console.error(
                "Services error:",
                error
            );


            servicesContainer.innerHTML = `

                <div class="empty">

                    ❌ حدث خطأ في تحميل طلبات الخدمات

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>

            `;

        }
    );

}


/* =====================================
   تغيير حالة الخدمة
===================================== */

async function changeServiceStatus(
    id,
    status
) {

    try {

        await update(
            ref(
                database,
                "services/" + id
            ),
            {
                status:
                    status
            }
        );


        if (
            status === "approved"
        ) {

            alert(
                "تمت الموافقة على الخدمة ✅"
            );

        }

        else {

            alert(
                "تم رفض الخدمة ❌"
            );

        }

    }

    catch (error) {

        console.error(
            error
        );

        alert(
            "حدث خطأ أثناء تحديث الخدمة:\n" +
            error.message
        );

    }

}


/* =====================================
   لا توجد طلبات
===================================== */

function showNoUsers() {

    usersContainer.innerHTML = `

        <div class="empty">

            لا توجد طلبات إنشاء حسابات معلقة حاليًا ✅

        </div>

    `;

}


function showNoServices() {

    servicesContainer.innerHTML = `

        <div class="empty">

            لا توجد طلبات خدمات معلقة حاليًا ✅

        </div>

    `;

}


/* =====================================
   اسم القسم
===================================== */

function getCategoryName(
    category
) {

    const categories = {

        services:
            "الخدمات",

        pharmacies:
            "الصيدليات",

        herbal:
            "العطارة",

        shops:
            "المحلات",

        important-numbers:
            "أرقام مهمة"

    };


    return (
        categories[category] ||
        category ||
        "غير محدد"
    );

}


/* =====================================
   التاريخ
===================================== */

function formatDate(
    timestamp
) {

    if (!timestamp)
        return "غير محدد";


    try {

        return new Date(
            timestamp
        ).toLocaleString(
            "ar-EG"
        );

    }

    catch {

        return "غير محدد";

    }

}


/* =====================================
   حماية HTML
===================================== */

function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value || "";


    return div.innerHTML;

}


/* =====================================
   تسجيل الخروج
===================================== */

logoutBtn.addEventListener(
    "click",
    async () => {

        try {

            await signOut(
                auth
            );

            window.location.href =
                "login.html";

        }

        catch (error) {

            console.error(
                error
            );

            alert(
                "حدث خطأ أثناء تسجيل الخروج."
            );

        }

    }
);

</script>

</body>

</html>
