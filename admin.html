<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة الإدارة - أهل البلد</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    #logoutBtn {
      border: 0;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      background: white;
      color: #2563eb;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .status {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    #adminStatus {
      color: #16a34a;
      font-weight: bold;
    }

    .request {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .request h3 {
      margin-top: 0;
      color: #2563eb;
    }

    .info {
      margin: 9px 0;
      color: #555;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .actions button {
      border: 0;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .approve {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 14px;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 25px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏠 لوحة إدارة أهل البلد</h1>

  <button id="logoutBtn">
    تسجيل الخروج
  </button>
</header>


<main>

  <div class="status">
    <strong>حالة الإدارة:</strong>
    <span id="adminStatus">
      جاري التحقق...
    </span>
  </div>


  <h2>طلبات الخدمات</h2>


  <div id="requestsContainer">
    <div class="loading">
      جاري تحميل الطلبات...
    </div>
  </div>

</main>


<script type="module">

  // ==========================================
  // Firebase
  // ==========================================

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  import {
    getDatabase,
    ref,
    onValue,
    update
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


  // ==========================================
  // إعدادات Firebase
  // ==========================================

  const firebaseConfig = {
    apiKey: "AIzaSyBpc-93tAPIRqYlrpKGc_Yg8QqxuX8PfGI",
    authDomain: "ahl-elbaled2.firebaseapp.com",
    databaseURL: "https://ahl-elbaled2-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "ahl-elbaled2",
    storageBucket: "ahl-elbaled2.firebasestorage.app",
    messagingSenderId: "984455426367",
    appId: "1:984455426367:web:5420f680f2a4f9b609238a",
    measurementId: "G-NQFQWK5T57"
  };


  // ==========================================
  // تشغيل Firebase
  // ==========================================

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const database = getDatabase(app);


  // ==========================================
  // عناصر الصفحة
  // ==========================================

  const requestsContainer =
    document.getElementById("requestsContainer");

  const adminStatus =
    document.getElementById("adminStatus");

  const logoutBtn =
    document.getElementById("logoutBtn");


  // ==========================================
  // التأكد من تسجيل الدخول
  // ==========================================

  onAuthStateChanged(auth, (user) => {

    if (!user) {

      window.location.href = "login.html";

      return;
    }


    adminStatus.textContent =
      "تم تسجيل الدخول كمسؤول ✅";


    loadRequests();

  });


  // ==========================================
  // تحميل الطلبات المعلقة
  // ==========================================

  function loadRequests() {

    const servicesRef =
      ref(database, "services");


    onValue(
      servicesRef,
      (snapshot) => {

        const data = snapshot.val();

        requestsContainer.innerHTML = "";


        if (!data) {

          requestsContainer.innerHTML = `
            <div class="empty">
              لا توجد طلبات حاليًا.
            </div>
          `;

          return;
        }


        let pendingCount = 0;


        Object.entries(data).forEach(
          ([id, service]) => {

            if (
              service.status !== "pending"
            ) {
              return;
            }


            pendingCount++;


            const request =
              document.createElement("div");


            request.className =
              "request";


            request.innerHTML = `

              <h3>
                ${escapeHTML(service.name)}
              </h3>

              <div class="info">
                <strong>التصنيف:</strong>
                ${escapeHTML(service.category)}
              </div>

              <div class="info">
                <strong>الوصف:</strong>
                ${escapeHTML(service.description)}
              </div>

              <div class="info">
                <strong>الهاتف:</strong>
                ${escapeHTML(service.phone)}
              </div>

              <div class="info">
                <strong>العنوان:</strong>
                ${escapeHTML(service.address)}
              </div>

              <div class="actions">

                <button
                  class="approve"
                  data-id="${id}">
                  ✅ موافقة
                </button>

                <button
                  class="reject"
                  data-id="${id}">
                  ❌ رفض
                </button>

              </div>
            `;


            requestsContainer.appendChild(
              request
            );

          }
        );


        if (pendingCount === 0) {

          requestsContainer.innerHTML = `
            <div class="empty">
              لا توجد طلبات معلقة حاليًا ✅
            </div>
          `;

          return;
        }


        // ======================================
        // زر الموافقة
        // ======================================

        document
          .querySelectorAll(".approve")
          .forEach((button) => {

            button.addEventListener(
              "click",
              () => {

                changeStatus(
                  button.dataset.id,
                  "approved"
                );

              }
            );

          });


        // ======================================
        // زر الرفض
        // ======================================

        document
          .querySelectorAll(".reject")
          .forEach((button) => {

            button.addEventListener(
              "click",
              () => {

                changeStatus(
                  button.dataset.id,
                  "rejected"
                );

              }
            );

          });

      },

      (error) => {

        console.error(error);

        requestsContainer.innerHTML = `
          <div class="empty">
            حدث خطأ أثناء تحميل الطلبات.
          </div>
        `;

      }
    );

  }


  // ==========================================
  // تغيير حالة الخدمة
  // ==========================================

  async function changeStatus(
    id,
    status
  ) {

    try {

      await update(
        ref(
          database,
          "services/" + id
        ),
        {
          status: status
        }
      );


      if (status === "approved") {

        alert(
          "تمت الموافقة على الخدمة ✅"
        );

      } else {

        alert(
          "تم رفض الخدمة ❌"
        );

      }

    } catch (error) {

      console.error(error);

      alert(
        "حدث خطأ أثناء تحديث الطلب."
      );

    }

  }


  // ==========================================
  // تسجيل الخروج
  // ==========================================

  logoutBtn.addEventListener(
    "click",
    async () => {

      try {

        await signOut(auth);

        window.location.href =
          "login.html";

      } catch (error) {

        console.error(error);

        alert(
          "حدث خطأ أثناء تسجيل الخروج."
        );

      }

    }
  );


  // ==========================================
  // حماية النصوص
  // ==========================================

  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value || "";

    return div.innerHTML;

  }

</script>

</body>
</html>
