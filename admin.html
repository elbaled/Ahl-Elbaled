<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>لوحة الإدارة - أهل البلد</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    #logoutBtn {
      border: 0;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      background: white;
      color: #2563eb;
      font-weight: bold;
    }

    main {
      max-width: 950px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .status {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    #adminStatus {
      color: #16a34a;
      font-weight: bold;
    }

    .section-title {
      margin-top: 30px;
      margin-bottom: 15px;
      color: #222;
    }

    .request {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .request h3 {
      margin-top: 0;
      color: #2563eb;
    }

    .account-number {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      padding: 7px 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .info {
      margin: 9px 0;
      color: #555;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .actions button {
      border: 0;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .approve {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 14px;
      color: #777;
      margin-bottom: 20px;
    }

    .loading {
      text-align: center;
      padding: 25px;
    }

    .divider {
      height: 2px;
      background: #e5e7eb;
      margin: 35px 0;
    }

    @media (max-width: 600px) {

      header {
        flex-direction: column;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<header>

  <h1>
    🏠 لوحة إدارة أهل البلد
  </h1>

  <button id="logoutBtn">
    تسجيل الخروج
  </button>

</header>


<main>


  <!-- حالة الإدارة -->

  <div class="status">

    <strong>
      حالة الإدارة:
    </strong>

    <span id="adminStatus">
      جاري التحقق...
    </span>

  </div>


  <!-- =====================================
       طلبات إنشاء الحسابات
  ====================================== -->

  <h2 class="section-title">
    👤 طلبات إنشاء الحسابات
  </h2>


  <div id="usersContainer">

    <div class="loading">
      جاري تحميل طلبات الحسابات...
    </div>

  </div>


  <div class="divider"></div>


  <!-- =====================================
       طلبات الخدمات
  ====================================== -->

  <h2 class="section-title">
    🛠️ طلبات الخدمات
  </h2>


  <div id="servicesContainer">

    <div class="loading">
      جاري تحميل طلبات الخدمات...
    </div>

  </div>


</main>


<script type="module">


/* =========================================
   Firebase
========================================= */


import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
  getDatabase,
  ref,
  onValue,
  update
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


/* =========================================
   Firebase Config
========================================= */


const firebaseConfig = {

  apiKey:
    "AIzaSyBpc-93tAPIRqYlrpKGc_Yg8QqxuX8PfGI",

  authDomain:
    "ahl-elbaled2.firebaseapp.com",

  databaseURL:
    "https://ahl-elbaled2-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "ahl-elbaled2",

  storageBucket:
    "ahl-elbaled2.firebasestorage.app",

  messagingSenderId:
    "984455426367",

  appId:
    "1:984455426367:web:5420f680f2a4f9b609238a",

  measurementId:
    "G-NQFQWK5T57"

};


/* =========================================
   تشغيل Firebase
========================================= */


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const database =
  getDatabase(app);


/* =========================================
   عناصر الصفحة
========================================= */


const adminStatus =
  document.getElementById(
    "adminStatus"
  );


const usersContainer =
  document.getElementById(
    "usersContainer"
  );


const servicesContainer =
  document.getElementById(
    "servicesContainer"
  );


const logoutBtn =
  document.getElementById(
    "logoutBtn"
  );


/* =========================================
   التأكد أن المستخدم أدمن
========================================= */


onAuthStateChanged(
  auth,
  async (user) => {

    if (!user) {

      window.location.href =
        "login.html";

      return;

    }


    /*
     * نجيب بيانات المستخدم
     * من Realtime Database
     */

    const userRef =
      ref(
        database,
        "users/" + user.uid
      );


    onValue(
      userRef,
      (snapshot) => {

        if (!snapshot.exists()) {

          adminStatus.textContent =
            "بيانات الحساب غير موجودة ❌";

          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 1500);

          return;

        }


        const userData =
          snapshot.val();


        /*
         * التأكد من أن الحساب أدمن
         */

        if (
          userData.role !== "admin"
        ) {

          adminStatus.textContent =
            "ليس لديك صلاحيات الإدارة ❌";

          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 1500);

          return;

        }


        /*
         * التأكد أن الأدمن نفسه معتمد
         */

        if (
          userData.status !== "approved"
        ) {

          adminStatus.textContent =
            "حساب الإدارة غير معتمد ❌";

          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 1500);

          return;

        }


        adminStatus.textContent =
          "تم تسجيل الدخول كمسؤول ✅";


        /*
         * تحميل الطلبات
         */

        loadUsers();

        loadServices();

      }
    );

  }
);


/* =========================================
   تحميل طلبات الحسابات
========================================= */


function loadUsers() {


  const usersRef =
    ref(
      database,
      "users"
    );


  onValue(

    usersRef,

    (snapshot) => {


      usersContainer.innerHTML =
        "";


      const data =
        snapshot.val();


      if (!data) {

        usersContainer.innerHTML = `

          <div class="empty">

            لا توجد حسابات مسجلة حاليًا.

          </div>

        `;

        return;

      }


      let pendingCount =
        0;


      Object.entries(data).forEach(

        ([uid, user]) => {


          /*
           * نعرض الحسابات
           * التي تنتظر موافقة الإدارة فقط
           */

          if (
            user.status !== "pending"
          ) {

            return;

          }


          pendingCount++;


          const request =
            document.createElement(
              "div"
            );


          request.className =
            "request";


          request.innerHTML = `

            <h3>
              👤 ${escapeHTML(
                user.name
              )}
            </h3>

            <div class="account-number">

              رقم الحساب:
              ${escapeHTML(
                String(
                  user.accountNumber || "غير محدد"
                )
              )}

            </div>

            <div class="info">

              <strong>
                البريد الإلكتروني:
              </strong>

              ${escapeHTML(
                user.email
              )}

            </div>

            <div class="info">

              <strong>
                نوع الحساب:
              </strong>

              مستخدم

            </div>

            <div class="actions">

              <button
                class="approve"
                data-uid="${uid}">

                ✅ الموافقة على الحساب

              </button>

              <button
                class="reject"
                data-uid="${uid}">

                ❌ رفض الحساب

              </button>

            </div>

          `;


          usersContainer.appendChild(
            request
          );

        }

      );


      if (
        pendingCount === 0
      ) {

        usersContainer.innerHTML = `

          <div class="empty">

            لا توجد طلبات إنشاء حسابات معلقة حاليًا ✅

          </div>

        `;

        return;

      }


      /*
       * أزرار الموافقة
       */

      document
        .querySelectorAll(
          ".approve"
        )
        .forEach(
          (button) => {

            button.addEventListener(
              "click",
              () => {

                approveUser(
                  button.dataset.uid
                );

              }
            );

          }
        );


      /*
       * أزرار الرفض
       */

      document
        .querySelectorAll(
          ".reject"
        )
        .forEach(
          (button) => {

            button.addEventListener(
              "click",
              () => {

                rejectUser(
                  button.dataset.uid
                );

              }
            );

          }
        );

    },

    (error) => {

      console.error(error);

      usersContainer.innerHTML = `

        <div class="empty">

          حدث خطأ أثناء تحميل طلبات الحسابات ❌

        </div>

      `;

    }

  );

}


/* =========================================
   الموافقة على حساب
========================================= */


async function approveUser(
  uid
) {

  try {

    await update(

      ref(
        database,
        "users/" + uid
      ),

      {
        status:
          "approved"
      }

    );


    alert(
      "تمت الموافقة على الحساب ✅"
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "حدث خطأ أثناء الموافقة على الحساب."
    );

  }

}


/* =========================================
   رفض حساب
========================================= */


async function rejectUser(
  uid
) {

  try {

    await update(

      ref(
        database,
        "users/" + uid
      ),

      {
        status:
          "rejected"
      }

    );


    alert(
      "تم رفض الحساب ❌"
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "حدث خطأ أثناء رفض الحساب."
    );

  }

}


/* =========================================
   تحميل طلبات الخدمات
========================================= */


function loadServices() {


  const servicesRef =
    ref(
      database,
      "services"
    );


  onValue(

    servicesRef,

    (snapshot) => {


      servicesContainer.innerHTML =
        "";


      const data =
        snapshot.val();


      if (!data) {

        servicesContainer.innerHTML = `

          <div class="empty">

            لا توجد طلبات خدمات حاليًا.

          </div>

        `;

        return;

      }


      let pendingCount =
        0;


      Object.entries(data).forEach(

        ([id, service]) => {


          if (
            service.status !== "pending"
          ) {

            return;

          }


          pendingCount++;


          const request =
            document.createElement(
              "div"
            );


          request.className =
            "request";


          request.innerHTML = `

            <h3>

              🛠️ ${escapeHTML(
                service.name
              )}

            </h3>


            <div class="info">

              <strong>
                التصنيف:
              </strong>

              ${escapeHTML(
                service.category
              )}

            </div>


            <div class="info">

              <strong>
                الوصف:
              </strong>

              ${escapeHTML(
                service.description
              )}

            </div>


            <div class="info">

              <strong>
                الهاتف:
              </strong>

              ${escapeHTML(
                service.phone
              )}

            </div>


            <div class="info">

              <strong>
                العنوان:
              </strong>

              ${escapeHTML(
                service.address
              )}

            </div>


            <div class="actions">

              <button
                class="approve"
                data-service-id="${id}">

                ✅ موافقة

              </button>


              <button
                class="reject"
                data-service-id="${id}">

                ❌ رفض

              </button>

            </div>

          `;


          servicesContainer.appendChild(
            request
          );

        }

      );


      if (
        pendingCount === 0
      ) {

        servicesContainer.innerHTML = `

          <div class="empty">

            لا توجد طلبات خدمات معلقة حاليًا ✅

          </div>

        `;

        return;

      }


      /*
       * الموافقة على الخدمات
       */

      servicesContainer
        .querySelectorAll(
          "[data-service-id]"
        )
        .forEach(
          (button) => {

            button.addEventListener(
              "click",
              () => {

                const id =
                  button.dataset.serviceId;


                const isApprove =
                  button.classList.contains(
                    "approve"
                  );


                changeServiceStatus(

                  id,

                  isApprove
                    ? "approved"
                    : "rejected"

                );

              }
            );

          }
        );

    },

    (error) => {

      console.error(error);

      servicesContainer.innerHTML = `

        <div class="empty">

          حدث خطأ أثناء تحميل طلبات الخدمات ❌

        </div>

      `;

    }

  );

}


/* =========================================
   تغيير حالة الخدمة
========================================= */


async function changeServiceStatus(
  id,
  status
) {

  try {

    await update(

      ref(
        database,
        "services/" + id
      ),

      {
        status:
          status
      }

    );


    if (
      status === "approved"
    ) {

      alert(
        "تمت الموافقة على الخدمة ✅"
      );

    }

    else {

      alert(
        "تم رفض الخدمة ❌"
      );

    }

  }

  catch (error) {

    console.error(error);

    alert(
      "حدث خطأ أثناء تحديث الخدمة."
    );

  }

}


/* =========================================
   تسجيل الخروج
========================================= */


logoutBtn.addEventListener(

  "click",

  async () => {

    try {

      await signOut(
        auth
      );


      window.location.href =
        "login.html";

    }

    catch (error) {

      console.error(error);

      alert(
        "حدث خطأ أثناء تسجيل الخروج."
      );

    }

  }

);


/* =========================================
   حماية النصوص
========================================= */


function escapeHTML(
  value
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    value || "";


  return div.innerHTML;

}


</script>

</body>

</html>
