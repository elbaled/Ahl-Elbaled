<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>تسجيل الدخول - أهل البلد</title>


    <style>

        /* =====================================
           RESET
        ===================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================
           BODY
        ===================================== */

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff 0%,
                    #f8fafc 45%,
                    #dbeafe 100%
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            color: #1e293b;

        }


        /* =====================================
           CONTAINER
        ===================================== */

        .login-wrapper {

            width: 100%;

            max-width: 460px;

        }


        /* =====================================
           LOGIN BOX
        ===================================== */

        .login-box {

            width: 100%;

            background:
                rgba(255, 255, 255, 0.97);

            padding:
                38px 32px 32px;

            border-radius: 24px;

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    0.8
                );

            box-shadow:
                0 20px 60px
                rgba(15, 23, 42, 0.12);

            position: relative;

            overflow: hidden;

        }


        /* =====================================
           TOP LINE
        ===================================== */

        .login-box::before {

            content: "";

            position: absolute;

            top: 0;

            right: 0;

            left: 0;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #1d4ed8,
                    #2563eb,
                    #60a5fa
                );

        }


        /* =====================================
           LOGO
        ===================================== */

        .logo-container {

            display: flex;

            justify-content: center;

            margin-bottom: 16px;

        }


        .logo {

            width: 82px;

            height: 82px;

            border-radius: 24px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            box-shadow:
                0 12px 25px
                rgba(37, 99, 235, 0.25);

            font-size: 42px;

        }


        /* =====================================
           TITLE
        ===================================== */

        h1 {

            text-align: center;

            margin-bottom: 8px;

            color: #0f172a;

            font-size: 29px;

            font-weight: 800;

        }


        /* =====================================
           SUBTITLE
        ===================================== */

        .subtitle {

            text-align: center;

            color: #64748b;

            margin-bottom: 30px;

            font-size: 15px;

            line-height: 1.7;

        }


        /* =====================================
           FORM GROUP
        ===================================== */

        .form-group {

            margin-bottom: 20px;

        }


        /* =====================================
           LABEL
        ===================================== */

        label {

            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 15px;

            font-weight: 700;

        }


        /* =====================================
           INPUT WRAPPER
        ===================================== */

        .input-wrapper {

            position: relative;

            width: 100%;

        }


        /* =====================================
           INPUT ICON
        ===================================== */

        .input-icon {

            position: absolute;

            right: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 19px;

            pointer-events: none;

            z-index: 2;

        }


        /* =====================================
           INPUT
        ===================================== */

        input {

            width: 100%;

            min-height: 52px;

            padding:
                14px 48px 14px 68px;

            border:
                1px solid #dbe2ea;

            border-radius: 14px;

            background: #f8fafc;

            color: #0f172a;

            font-size: 16px;

            outline: none;

            direction: ltr;

            text-align: left;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

        }


        input::placeholder {

            color: #94a3b8;

        }


        input:focus {

            background: #ffffff;

            border-color: #2563eb;

            box-shadow:
                0 0 0 4px
                rgba(37, 99, 235, 0.10);

        }


        /* =====================================
           PASSWORD BUTTON
        ===================================== */

        .password-toggle {

            position: absolute;

            left: 8px;

            top: 50%;

            transform:
                translateY(-50%);

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 10px;

            background: #f1f5f9;

            color: #64748b;

            font-size: 18px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 0;

            z-index: 5;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;

        }


        .password-toggle:hover {

            background: #eff6ff;

            color: #2563eb;

        }


        .password-toggle:active {

            transform:
                translateY(-50%)
                scale(0.94);

        }


        /* =====================================
           LOGIN BUTTON
        ===================================== */

        #loginButton {

            width: 100%;

            min-height: 54px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 17px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 10px 22px
                rgba(37, 99, 235, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;

        }


        #loginButton:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 14px 28px
                rgba(37, 99, 235, 0.28);

        }


        #loginButton:active {

            transform:
                translateY(0);

        }


        #loginButton:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;

        }


        /* =====================================
           MESSAGE
        ===================================== */

        #message {

            margin-top: 17px;

            min-height: 28px;

            text-align: center;

            font-size: 14px;

            font-weight: 700;

            line-height: 1.7;

            padding: 0 5px;

        }


        /* =====================================
           LINKS
        ===================================== */

        .links {

            margin-top: 24px;

            padding-top: 20px;

            border-top:
                1px solid #e2e8f0;

            display: flex;

            flex-direction: column;

            gap: 10px;

        }


        .back {

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 44px;

            border-radius: 12px;

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            transition:
                background 0.2s ease,
                color 0.2s ease;

        }


        .back:hover {

            background: #eff6ff;

            color: #1d4ed8;

        }


        .back.secondary {

            color: #64748b;

        }


        .back.secondary:hover {

            color: #334155;

            background: #f8fafc;

        }


        /* =====================================
           FOOTER
        ===================================== */

        .login-footer {

            text-align: center;

            margin-top: 22px;

            color: #94a3b8;

            font-size: 12px;

            line-height: 1.8;

        }


        /* =====================================
           DEVELOPER CREDIT
        ===================================== */

        .developer-credit {

            margin-top: 6px;

            color: #2563eb;

            font-size: 13px;

            font-weight: 800;

            text-align: center;

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            body {

                padding: 14px;

                align-items: center;

            }


            .login-box {

                padding:
                    32px 20px 24px;

                border-radius: 21px;

            }


            .logo {

                width: 72px;

                height: 72px;

                border-radius: 21px;

                font-size: 36px;

            }


            h1 {

                font-size: 25px;

            }


            .subtitle {

                margin-bottom: 25px;

                font-size: 14px;

            }


            input {

                min-height: 50px;

                font-size: 16px;

                padding:
                    13px 48px 13px 64px;

            }


            .password-toggle {

                left: 7px;

                width: 40px;

                height: 40px;

            }


            #loginButton {

                min-height: 52px;

                font-size: 16px;

            }

        }


        /* =====================================
           SMALL MOBILE
        ===================================== */

        @media (max-width: 380px) {

            body {

                padding: 10px;

            }


            .login-box {

                padding:
                    28px 16px 20px;

                border-radius: 18px;

            }


            .logo {

                width: 64px;

                height: 64px;

                font-size: 32px;

            }


            h1 {

                font-size: 23px;

            }


            label {

                font-size: 14px;

            }


            input {

                padding:
                    13px 46px 13px 60px;

            }


            .password-toggle {

                left: 5px;

            }

        }


    </style>

</head>


<body>


<div class="login-wrapper">


    <div class="login-box">


        <!-- =========================
             LOGO
        ========================== -->

        <div class="logo-container">

            <div class="logo">

                🏠

            </div>

        </div>


        <!-- =========================
             TITLE
        ========================== -->

        <h1>

            أهل البلد

        </h1>


        <p class="subtitle">

            سجل دخولك للوصول إلى خدمات أهل البلد

        </p>


        <!-- =========================
             LOGIN FORM
        ========================== -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">

                    البريد الإلكتروني

                </label>


                <div class="input-wrapper">

                    <span class="input-icon">

                        📧

                    </span>


                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        required
                        autocomplete="username"
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    كلمة المرور

                </label>


                <div class="input-wrapper">

                    <span class="input-icon">

                        🔒

                    </span>


                    <input
                        type="password"
                        id="password"
                        placeholder="أدخل كلمة المرور"
                        required
                        autocomplete="current-password"
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="إظهار كلمة المرور"
                    >

                        👁️

                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                id="loginButton"
            >

                دخول

            </button>


        </form>


        <!-- =========================
             MESSAGE
        ========================== -->

        <div id="message"></div>


        <!-- =========================
             LINKS
        ========================== -->

        <div class="links">


            <a
                href="register.html"
                class="back"
            >

                📝 إنشاء حساب جديد

            </a>


            <a
                href="index.html"
                class="back secondary"
            >

                ← العودة للموقع

            </a>


        </div>


        <!-- =========================
             FOOTER
        ========================== -->

        <div class="login-footer">

            أهل البلد © 2026

            <div class="developer-credit">

                مطور أحمد سمير

            </div>

        </div>


    </div>


</div>



<script type="module">


import {

    initializeApp

} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {

    getAuth,

    signInWithEmailAndPassword

} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {

    getDatabase,

    ref,

    get

} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBpc-93tAPIRqYlrpKGc_Yg8QqxuX8PfGI",

    authDomain:
        "ahl-elbaled2.firebaseapp.com",

    databaseURL:
        "https://ahl-elbaled2-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "ahl-elbaled2",

    storageBucket:
        "ahl-elbaled2.firebasestorage.app",

    messagingSenderId:
        "984455426367",

    appId:
        "1:984455426367:web:5420f680f2a4f9b609238a",

    measurementId:
        "G-NQFQWK5T57"

};



/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const database =
    getDatabase(app);



/* =========================
   ELEMENTS
========================= */

const loginForm =
    document.getElementById("loginForm");


const message =
    document.getElementById("message");


const loginButton =
    document.getElementById("loginButton");


const password =
    document.getElementById("password");


const passwordToggle =
    document.getElementById("passwordToggle");



/* =========================
   SHOW / HIDE PASSWORD
========================= */

if (passwordToggle) {

    passwordToggle.addEventListener(
        "click",
        () => {

            if (
                password.type ===
                "password"
            ) {

                password.type =
                    "text";

                passwordToggle.textContent =
                    "🙈";

                passwordToggle.setAttribute(
                    "aria-label",
                    "إخفاء كلمة المرور"
                );

            }

            else {

                password.type =
                    "password";

                passwordToggle.textContent =
                    "👁️";

                passwordToggle.setAttribute(
                    "aria-label",
                    "إظهار كلمة المرور"
                );

            }

        }
    );

}



/* =========================
   LOGIN
========================= */

loginForm.addEventListener(

    "submit",

    async (event) => {


        event.preventDefault();



        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const passwordValue =
            document
                .getElementById("password")
                .value;



        /* =========================
           LOADING
        ========================== */

        message.textContent =
            "جاري تسجيل الدخول...";

        message.style.color =
            "#2563eb";


        loginButton.disabled =
            true;


        loginButton.textContent =
            "جاري الدخول...";



        try {


            /* =========================
               FIREBASE AUTH
            ========================== */

            const result =
                await signInWithEmailAndPassword(

                    auth,

                    email,

                    passwordValue

                );



            const uid =
                result.user.uid;



            console.log(
                "تم تسجيل الدخول Firebase"
            );


            console.log(
                "UID:",
                uid
            );



            /* =========================
               READ USER DATA
            ========================== */

            const userPath =
                "users/" + uid;



            const userRef =
                ref(

                    database,

                    userPath

                );



            console.log(
                "Database URL:",
                firebaseConfig.databaseURL
            );


            console.log(
                "Reading path:",
                userPath
            );



            const snapshot =
                await get(userRef);



            console.log(
                "Data exists:",
                snapshot.exists()
            );


            console.log(
                "Data:",
                snapshot.val()
            );



            /* =========================
               USER NOT FOUND
            ========================== */

            if (!snapshot.exists()) {


                message.textContent =
                    "بيانات الحساب غير موجودة في النظام.";

                message.style.color =
                    "#dc2626";


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "دخول";


                return;

            }



            /* =========================
               USER DATA
            ========================== */

            const userData =
                snapshot.val();



            /* =========================
               PENDING
            ========================== */

            if (

                userData.status ===
                "pending"

            ) {


                message.textContent =
                    "حسابك قيد المراجعة ⏳";

                message.style.color =
                    "#d97706";


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "دخول";


                return;

            }



            /* =========================
               REJECTED
            ========================== */

            if (

                userData.status ===
                "rejected"

            ) {


                message.textContent =
                    "تم رفض طلب إنشاء الحساب ❌";

                message.style.color =
                    "#dc2626";


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "دخول";


                return;

            }



            /* =========================
               NOT APPROVED
            ========================== */

            if (

                userData.status !==
                "approved"

            ) {


                message.textContent =
                    "لا يمكن الدخول بهذا الحساب حاليًا.";

                message.style.color =
                    "#dc2626";


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "دخول";


                return;

            }



            /* =========================
               APPROVED
            ========================== */

            message.textContent =
                "تم تسجيل الدخول بنجاح ✅";


            message.style.color =
                "#16a34a";



            console.log(
                "الحساب معتمد"
            );


            console.log(
                "Account Number:",
                userData.accountNumber
            );


            console.log(
                "Role:",
                userData.role
            );



            /*
             * مهم:
             *
             * الأدمن والمستخدم العادي
             * يدخلان نفس الموقع.
             *
             * لن يتم تحويل الأدمن
             * إلى admin.html.
             */


            setTimeout(

                () => {

                    window.location.href =
                        "index.html";

                },

                700

            );

        }



        /* =========================
           ERROR
        ========================== */

        catch (error) {


            console.error(
                "Firebase Login Error:",
                error
            );


            console.error(
                "Error Code:",
                error.code
            );



            message.textContent =
                "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            message.style.color =
                "#dc2626";



            loginButton.disabled =
                false;


            loginButton.textContent =
                "دخول";

        }

    }

);


</script>


</body>

</html>
