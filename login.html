<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>تسجيل الدخول - أهل البلد</title>


    <style>

        /* =====================================
           RESET
        ===================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================
           BODY
        ===================================== */

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff 0%,
                    #f8fafc 45%,
                    #dbeafe 100%
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            color: #1e293b;

        }


        /* =====================================
           CONTAINER
        ===================================== */

        .login-wrapper {

            width: 100%;

            max-width: 460px;

        }


        /* =====================================
           LOGIN BOX
        ===================================== */

        .login-box {

            width: 100%;

            background:
                rgba(255, 255, 255, 0.97);

            padding:
                38px 32px 32px;

            border-radius: 24px;

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    0.8
                );

            box-shadow:
                0 20px 60px
                rgba(15, 23, 42, 0.12);

            position: relative;

            overflow: hidden;

        }


        /* =====================================
           TOP LINE
        ===================================== */

        .login-box::before {

            content: "";

            position: absolute;

            top: 0;

            right: 0;

            left: 0;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #1d4ed8,
                    #2563eb,
                    #60a5fa
                );

        }


        /* =====================================
           LOGO
        ===================================== */

        .logo-container {

            display: flex;

            justify-content: center;

            margin-bottom: 16px;

        }


        .logo {

            width: 82px;

            height: 82px;

            border-radius: 24px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            box-shadow:
                0 12px 25px
                rgba(37, 99, 235, 0.25);

            font-size: 42px;

        }


        /* =====================================
           TITLE
        ===================================== */

        h1 {

            text-align: center;

            margin-bottom: 8px;

            color: #0f172a;

            font-size: 29px;

            font-weight: 800;

        }


        /* =====================================
           SUBTITLE
        ===================================== */

        .subtitle {

            text-align: center;

            color: #64748b;

            margin-bottom: 30px;

            font-size: 15px;

            line-height: 1.7;

        }


        /* =====================================
           FORM GROUP
        ===================================== */

        .form-group {

            margin-bottom: 20px;

        }


        /* =====================================
           LABEL
        ===================================== */

        label {

            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 15px;

            font-weight: 700;

        }


        /* =====================================
           INPUT WRAPPER
        ===================================== */

        .input-wrapper {

            position: relative;

            width: 100%;

        }


        /* =====================================
           INPUT ICON
        ===================================== */

        .input-icon {

            position: absolute;

            right: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 19px;

            pointer-events: none;

            z-index: 2;

        }


        /* =====================================
           INPUT
        ===================================== */

        input {

            width: 100%;

            min-height: 52px;

            /*
             * المسافة من اليمين للأيقونة
             * والمسافة من الشمال لزر العين
             */

            padding:
                14px 48px 14px 62px;

            border:
                1px solid #dbe2ea;

            border-radius: 14px;

            background: #f8fafc;

            color: #0f172a;

            font-size: 16px;

            outline: none;

            direction: ltr;

            text-align: left;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

        }


        input::placeholder {

            color: #94a3b8;

        }


        input:focus {

            background: #ffffff;

            border-color: #2563eb;

            box-shadow:
                0 0 0 4px
                rgba(37, 99, 235, 0.10);

        }


        /* =====================================
           PASSWORD TOGGLE
        ===================================== */

        .password-toggle {

            position: absolute;

            left: 10px;

            top: 50%;

            transform:
                translateY(-50%);

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 10px;

            background: transparent;

            color: #64748b;

            font-size: 19px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 0;

            z-index: 5;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;

        }


        .password-toggle:hover {

            background: #eff6ff;

            color: #2563eb;

        }


        .password-toggle:active {

            transform:
                translateY(-50%)
                scale(0.94);

        }


        /* =====================================
           LOGIN BUTTON
        ===================================== */

        #loginButton {

            width: 100%;

            min-height: 54px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 17px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 10px 22px
                rgba(37, 99, 235, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;

        }


        #loginButton:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 14px 28px
                rgba(37, 99, 235, 0.28);

        }


        #loginButton:active {

            transform:
                translateY(0);

        }


        #loginButton:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;

        }


        /* =====================================
           MESSAGE
        ===================================== */

        #message {

            margin-top: 17px;

            min-height: 28px;

            text-align: center;

            font-size: 14px;

            font-weight: 700;

            line-height: 1.7;

            padding: 0 5px;

        }


        /* =====================================
           LINKS
        ===================================== */

        .links {

            margin-top: 24px;

            padding-top: 20px;

            border-top:
                1px solid #e2e8f0;

            display: flex;

            flex-direction: column;

            gap: 10px;

        }


        .back {

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 44px;

            border-radius: 12px;

            color: #2563eb
