<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دخول الإدارة - أهل البلد</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            direction: ltr;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            min-height: 24px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🏠</div>

        <h1>أهل البلد</h1>

        <p class="subtitle">
            تسجيل دخول الإدارة
        </p>

        <form id="loginForm">

            <label for="email">
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="email"
                placeholder="admin@example.com"
                required
                autocomplete="username"
            >

            <label for="password">
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                placeholder="كلمة المرور"
                required
                autocomplete="current-password"
            >

            <button type="submit" id="loginButton">
                دخول
            </button>

        </form>

        <div id="message"></div>

        <a href="index.html" class="back">
            ← العودة للموقع
        </a>

    </div>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        /*
         * مهم جدًا:
         * استخدم نفس firebaseConfig الموجود
         * في index.html الخاص بمشروعك.
         */

    
      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
      
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  databaseURL: "YOUR_DATABASE_URL",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID",
  measurementId: "YOUR_MEASUREMENT_ID"
};


        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);


        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");

        const loginButton =
            document.getElementById("loginButton");


        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                message.textContent =
                    "جاري تسجيل الدخول...";

                loginButton.disabled = true;


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    message.textContent =
                        "تم تسجيل الدخول بنجاح ✅";


                    setTimeout(() => {

                        window.location.href =
                            "admin.html";

                    }, 700);


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

                    loginButton.disabled = false;

                }

            }
        );

    </script>

</body>
</html>
