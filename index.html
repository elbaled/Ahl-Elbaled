<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="أهل البلد - خدمات ومحلات وصيدليات وعطارة وأرقام تهمك وإعلانات بلدك">

    <title>أهل البلد | خدمات بلدك في مكان واحد</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================
           SERVICE DETAILS MODAL
        ========================= */

        .service-details-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .service-details-modal.active {
            display: flex;
        }

        .service-details-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
        }

        .service-details-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
        }

        .service-details-close {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: #f1f5f9;
            color: #333;
            font-size: 22px;
            cursor: pointer;
        }

        .service-details-image {
            width: 100%;
            height: 220px;
            border-radius: 15px;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .service-details-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .service-details-title {
            margin: 0 40px 8px 0;
            font-size: 25px;
            color: #1e3a8a;
        }

        .service-details-category {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .service-details-description {
            color: #555;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .service-detail-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 13px 0;
            border-bottom: 1px solid #eee;
        }

        .service-detail-icon {
            font-size: 23px;
            min-width: 32px;
        }

        .service-detail-info {
            flex: 1;
        }

        .service-detail-info strong {
            display: block;
            margin-bottom: 4px;
            color: #222;
        }

        .service-detail-info span {
            color: #666;
            line-height: 1.6;
        }

        .service-phone-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border-radius: 12px;
            background: #16a34a;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
        }

        /* =========================
           ADD SERVICE MODAL FIX
        ========================= */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal.active {
            display: flex !important;
        }

        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
        }

        .modal-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .modal-close {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: #f1f5f9;
            color: #333;
            font-size: 20px;
            cursor: pointer;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-header > span {
            font-size: 40px;
        }

        .modal-header h2 {
            margin: 8px 0;
        }

        .modal-header p {
            color: #777;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
        }

        .form-group textarea {
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            border: 0;
            cursor: pointer;
        }

        .form-note {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 12px;
        }

        .service-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 18px;
        }

        .service-gallery-empty {
            grid-column: 1 / -1;
            background: #f8fafc;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            color: #888;
        }

        .service-gallery img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
        }

        .service-card {
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .modal-content {
                padding: 18px;
                max-height: 92vh;
            }

            .service-details-content {
                padding: 18px;
            }

            .service-details-image {
                height: 180px;
            }
        }
    </style>
</head>

<body>

<header class="main-header">

    <div class="container header-content">

        <a href="#home" class="logo">
            <span class="logo-icon">🏘️</span>
            <span>أهل البلد</span>
        </a>

        <nav class="main-nav">
            <a href="#home">الرئيسية</a>
            <a href="#categories">الأقسام</a>
            <a href="#services">الخدمات</a>
            <a href="#ads">الإعلانات</a>
            <a href="#important-numbers">أرقام تهمك</a>
        </nav>

        <div class="header-actions">

            <button
                class="notification-btn"
                id="notificationBtn"
                type="button">
                🔔
                <span id="notificationCount">0</span>
            </button>

            <div id="accountArea">

                <a
                    class="login-btn"
                    id="loginBtn"
                    href="login.html">
                    👤 دخول
                </a>

            </div>

        </div>

    </div>

</header>


<main>

<section class="hero" id="home">

    <div class="container hero-content">

        <div class="hero-text">

            <span class="hero-badge">
                🏡 كل احتياجات بلدك في مكان واحد
            </span>

            <h1>
                أهلاً بيك في
                <strong>أهل البلد</strong>
            </h1>

            <p>
                ابحث عن الخدمات والمحلات والصيدليات
                والعطارة والأرقام المهمة والإعلانات
                الموجودة في بلدك.
            </p>

            <div class="hero-actions">

                <button
                    class="primary-btn"
                    id="addServiceHeroBtn"
                    type="button">
                    ➕ أضف خدمتك
                </button>

                <a
                    href="#categories"
                    class="secondary-btn">
                    استكشف الأقسام
                </a>

            </div>

        </div>

    </div>

</section>


<section class="search-section">

    <div class="container">

        <div class="search-box">

            <span class="search-icon">🔎</span>

            <input
                type="search"
                id="searchInput"
                placeholder="ابحث عن خدمة، محل، صيدلية، عطارة..."
                autocomplete="off">

            <button
                id="searchBtn"
                type="button">
                بحث
            </button>

        </div>

    </div>

</section>


<section class="section" id="categories">

    <div class="container">

        <div class="section-heading">

            <span>استكشف</span>

            <h2>أقسام أهل البلد</h2>

            <p>اختار القسم اللي بتدور عليه</p>

        </div>

        <div class="categories-grid">

            <button
                class="category-card"
                data-category="services"
                type="button">

                <span class="category-icon">🛠️</span>
                <h3>الخدمات</h3>
                <p>صنايعية وحرفيين</p>

            </button>

            <button
                class="category-card"
                data-category="pharmacies"
                type="button">

                <span class="category-icon">💊</span>
                <h3>الصيدليات</h3>
                <p>صيدليات وأرقامها</p>

            </button>

            <button
                class="category-card"
                data-category="herbal"
                type="button">

                <span class="category-icon">🌿</span>
                <h3>العطارة</h3>
                <p>عطارة ومنتجات طبيعية</p>

            </button>

            <button
                class="category-card"
                data-category="shops"
                type="button">

                <span class="category-icon">🛒</span>
                <h3>المحلات</h3>
                <p>محلات ومنتجات</p>

            </button>

            <button
                class="category-card"
                data-category="important-numbers"
                type="button">

                <span class="category-icon">📞</span>
                <h3>أرقام تهمك</h3>
                <p>أرقام وخدمات مهمة</p>

            </button>

            <button
                class="category-card"
                data-category="ads"
                type="button">

                <span class="category-icon">📢</span>
                <h3>الإعلانات</h3>
                <p>أحدث الإعلانات</p>

            </button>

        </div>

    </div>

</section>
